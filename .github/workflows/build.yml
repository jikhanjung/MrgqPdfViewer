# 재사용 가능한 빌드 정의 (single source of truth).
#
# 개발 빌드(android-build.yml)와 릴리스(release.yml)가 **같은 정의를 호출**한다.
# 정의를 두 벌 두면 반드시 드리프트하기 때문이다 (guides/desktop/ci.md §6).
name: Build (reusable)

on:
  workflow_call:
    inputs:
      artifact-suffix:
        description: 아티팩트 이름 접미사 (릴리스에서 구분용)
        type: string
        default: ''
      ref:
        description: |
          빌드할 ref. 비우면 워크플로우를 트리거한 ref.
          release.yml 이 workflow_dispatch 로 기존 태그를 재릴리스할 때, 호출자는 main 에서
          돌지만 빌드는 그 태그의 코드로 해야 하므로 필요하다.
        type: string
        default: ''
    outputs:
      version-name:
        description: build.gradle.kts 의 versionName
        value: ${{ jobs.build.outputs.version-name }}
      signed-with-release-key:
        description: release 서명에 실제 릴리스 키를 썼는지 (false 면 debug 키 폴백)
        value: ${{ jobs.build.outputs.signed-with-release-key }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # step 의 if 에서는 secrets 컨텍스트를 쓸 수 없어 job env 로 우회
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      signed-with-release-key: ${{ steps.version.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version from build.gradle.kts
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "signed=$HAS_RELEASE_KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME / versionCode=$CODE" >> "$GITHUB_STEP_SUMMARY"

      # 릴리즈 서명 키가 secrets 에 등록된 경우에만 signing.properties 생성.
      # 없으면 app/build.gradle.kts 의 폴백(debug keystore)으로 서명됨.
      - name: Restore release keystore (optional)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > signing.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      # release 서명 폴백(~/.android/debug.keystore)은 AGP 가 자동 생성해주지
      # 않으므로 (기본 debug 서명 설정에서만 자동 생성) CI 에서 직접 만들어 둔다.
      - name: Ensure debug keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE != 'true' }}
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      # guides/desktop/ci.md §9 — "빌드되고 체크섬까지 났는데 첨부는 안 된" 사고를 막는다.
      # 수집 glob 이 실제 산출물에 닿는지 업로드 **전에** 확인한다.
      - name: Verify artifacts exist
        run: |
          set -e
          shopt -s nullglob
          debug=(app/build/outputs/apk/debug/*.apk)
          release=(app/build/outputs/apk/release/*.apk)
          echo "debug:   ${debug[*]:-(없음)}"
          echo "release: ${release[*]:-(없음)}"
          [ ${#debug[@]} -gt 0 ] || { echo "::error::debug APK 없음"; exit 1; }
          [ ${#release[@]} -gt 0 ] || { echo "::error::release APK 없음"; exit 1; }
          {
            echo "### 산출물"
            for f in "${debug[@]}" "${release[@]}"; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk${{ inputs.artifact-suffix }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk${{ inputs.artifact-suffix }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
