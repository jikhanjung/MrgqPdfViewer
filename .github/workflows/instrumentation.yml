# 에뮬레이터에서 도는 검증 — 단위 테스트가 볼 수 없는 것들.
#
# 가이드(guides/desktop/ci.md §1 OS 매트릭스, §5 packaged-artifact smoke)의 Android 대응물:
#
#  1. **API 레벨 매트릭스** — 데스크탑의 OS 매트릭스에 해당한다. minSdk 21 을 선언만 하고
#     한 번도 검증한 적이 없었고, 실제로 그 구간에서 합주 기능이 죽는 버그가 있었다
#     (java.util.Base64 는 API 26+). Lint 가 정적으로 잡아주긴 하지만 런타임 확인은 별개다.
#  2. **release APK 스모크** — "소스는 되는데 최적화 빌드에서 깨지는" 표면.
#     이 앱은 isMinifyEnabled = true 인데 **릴리스 APK 가 한 번도 실행된 적이 없다**
#     (Android Studio 는 debug 를 설치하고, v0.1.13 은 빌드·서명·배포만 됐다).
#     R8 이 enum 상수명을 난독화하면 Room 에 저장된 DisplayMode 를 못 읽는다.
#
# 에뮬레이터는 느리고(회당 ~10분) 가끔 불안정하다. 그래서 main 푸시와 수동 실행에서만 돈다
# — PR 마다 돌리지 않는다.
name: Instrumentation

on:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - '.github/workflows/instrumentation.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk — 선언만 하고 검증한 적 없던 하한
          - api-level: 21
            target: default
            arch: x86
          # targetSdk
          - api-level: 30
            target: google_apis
            arch: x86
          # 실제 사용 기기 (Google TV Streamer = Android 14)
          - api-level: 34
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 에뮬레이터는 KVM 이 있어야 쓸 만한 속도가 나온다
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # release 서명은 signing.properties 가 없으면 ~/.android/debug.keystore 로 폴백하는데,
      # 그 파일은 debug 서명 설정에서만 AGP 가 자동 생성한다. 러너에는 없으므로 직접 만든다.
      # (build.yml 에는 있고 여기에는 없어서 이 워크플로는 도입 이후 한 번도 통과하지 못했다 —
      #  세 매트릭스 전부 assembleRelease 단계에서 죽었다.)
      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Run instrumentation tests + release smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # ⚠️ 러너는 이 script 를 **한 줄씩 별도의 sh 로** 실행한다.
          # 여러 줄 구문(if/fi, 여러 줄 대입)도, 앞 줄의 `set -eu` 도 다음 줄로 이어지지
          # 않는다. 그래서 각 줄은 그 자체로 완결된 명령이어야 하고, 로직은 파일로 뺀다.
          script: |
            ./gradlew connectedDebugAndroidTest
            bash .github/scripts/release_smoke.sh ${{ matrix.api-level }}

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
