# 개발 빌드 — main 푸시 / PR / 수동 실행.
#
# 빌드 정의 자체는 build.yml 에 있다. 릴리스(release.yml)와 **같은 정의를 호출**해
# 두 경로가 드리프트하지 않게 한다 (guides/desktop/ci.md §6, §9 "build before you tag").
#
# 태그(v*)는 여기서 처리하지 않는다 → release.yml 이 받는다.
name: Android Build

on:
  push:
    branches: [main]
    # 문서만 바꾼 푸시는 빌드하지 않는다 — Actions 분 (P15 §2.3). 릴리스 커밋은 build.gradle.kts 도 바꾸므로 빌드된다
    paths-ignore:
      - 'devlog/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'devlog/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
