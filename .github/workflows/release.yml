# 태그 기반 릴리스 자동화 (guides/desktop/packaging-release.md §6, §7).
#
#   v* 태그 푸시 → verify (태그 == versionName, CHANGELOG 섹션 존재)
#              → build (build.yml 재사용, 개발 빌드와 동일 정의)
#              → release (APK + SHA256SUMS.txt 첨부, 본문 = CHANGELOG 섹션 그대로)
#
# 릴리스 노트의 단일 출처는 CHANGELOG.md 다. 별도 RELEASE_NOTES 를 두지 않는다 — 반드시 낡는다.
# SemVer 사전 릴리스(-alpha/-beta/-rc)는 자동으로 pre-release 로 표시된다.
name: Release

on:
  push:
    tags: ['v*']
  # 이미 푸시된 태그로 릴리스를 (재)생성할 때. 태그를 지웠다 다시 만들지 않기 위해 존재한다
  # — 태그는 삭제·재사용·amend 하지 않는다는 원칙(packaging-release.md §6).
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스를 만들 기존 태그 (예: v0.1.13)'
        required: true
        type: string

jobs:
  verify:
    name: Verify version & changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # 직전 릴리스 태그의 versionCode 를 읽으려고 (태그 · 커밋 전부)

      - name: Resolve & verify version
        id: v
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # SemVer 형식 확인 (사전 릴리스 접미사 허용)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?(-test)?$ ]]; then
            echo "::error::태그 '$TAG' 가 SemVer 형식이 아닙니다 (기대: vMAJOR.MINOR.PATCH[-alpha|beta|rc[.N]])"
            exit 1
          fi

          # 사전 릴리스 판정
          if [[ "$VERSION" == *-alpha* || "$VERSION" == *-beta* || "$VERSION" == *-rc* || "$VERSION" == *-test ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # 태그 == build.gradle.kts 의 versionName (버전 단일 출처)
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "태그: $TAG / versionName: $GRADLE_VERSION / versionCode: $VERSION_CODE"
          if [[ "$VERSION" != "$GRADLE_VERSION" && "$VERSION" != *-test ]]; then
            echo "::error::태그($VERSION) 와 build.gradle.kts 의 versionName($GRADLE_VERSION) 이 다릅니다"
            exit 1
          fi

          # versionCode 는 직전 태그보다 커야 한다 — 같으면 기기가 업데이트로 보지 않는다(앱 안 업데이트 · 덮어쓰기 설치).
          # 직전 태그 = 버전 순으로 이 태그 바로 아래 v* 태그(-test 제외). 없으면(첫 태그) 건너뛴다
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-test$' | awk -v cur="$TAG" 'found { print; exit } $0 == cur { found = 1 }')
          if [[ -n "$PREV_TAG" && "$VERSION" != *-test ]]; then
            PREV_CODE=$(git show "$PREV_TAG:app/build.gradle.kts" | grep -oP 'versionCode\s*=\s*\K\d+' || true)
            echo "직전 태그: $PREV_TAG / versionCode: ${PREV_CODE:-?}"
            if [[ -n "$PREV_CODE" ]] && (( VERSION_CODE <= PREV_CODE )); then
              echo "::error::versionCode($VERSION_CODE) 가 직전 태그 $PREV_TAG 의 versionCode($PREV_CODE) 보다 커야 합니다"
              exit 1
            fi
          fi

          # CHANGELOG 섹션이 있어야 릴리스 노트가 빈 채로 나가지 않는다
          if [[ "$VERSION" != *-test ]] && ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 에 '## [$VERSION]' 섹션이 없습니다. 릴리스 노트 없이 태그할 수 없습니다"
            exit 1
          fi

          {
            echo "### 릴리스 검증"
            echo "- 태그: \`$TAG\`"
            echo "- versionName: \`$GRADLE_VERSION\` / versionCode: \`$VERSION_CODE\`"
            echo "- 사전 릴리스: \`$([[ "$VERSION" == *-alpha* || "$VERSION" == *-beta* || "$VERSION" == *-rc* || "$VERSION" == *-test ]] && echo yes || echo no)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      artifact-suffix: -release-build
      # workflow_dispatch 로 기존 태그를 재릴리스할 때도 그 태그의 코드로 빌드되게 한다
      ref: ${{ needs.verify.outputs.tag }}

  publish:
    name: Create GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          pattern: '*-release-build'
          path: artifacts
          merge-multiple: true

      - name: Collect artifacts & checksums
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -name '*.apk' -exec cp {} dist/ \;
          cd dist
          ls -1
          # guides §9 — 수집 glob 이 실제로 무언가를 잡았는지 확인. 빈 릴리스를 만들지 않는다.
          count=$(ls -1 *.apk 2>/dev/null | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::첨부할 APK 가 없습니다"; exit 1; }
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          SIGNED: ${{ needs.build.outputs.signed-with-release-key }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          # CHANGELOG 의 해당 버전 섹션을 **그대로** 릴리스 본문으로 쓴다 (단일 출처).
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md)

          if [ -z "$(echo "$BODY" | tr -d '[:space:]-')" ]; then
            BODY="_(CHANGELOG 에 해당 섹션이 없거나 비어 있습니다 — 테스트 태그일 수 있음)_"
          fi
          # ScoreMate 서버에 올릴 변경 내용 — CHANGELOG 섹션만(빌드 정보 빼고, 앱 업데이트 알림에 그대로 보인다, P15 §2.3)
          echo "$BODY" > changelog-section.md

          {
            echo "$BODY"
            echo
            echo "---"
            echo
            echo "### 빌드 정보"
            echo "- 태그: \`${TAG}\` / 커밋: \`${SHA}\`"
            echo "- 워크플로우: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            if [ "$SIGNED" = "true" ]; then
              echo "- 서명: 릴리스 키"
            else
              echo "- ⚠️ 서명: **debug keystore 폴백** (\`RELEASE_KEYSTORE_*\` secrets 미등록)."
              echo "  Play 스토어 배포 불가이며, 기존 정식 서명 설치본 위에 덮어쓸 수 없습니다."
            fi
            echo "- 무결성: \`sha256sum -c SHA256SUMS.txt\`"
          } > release-notes.md

          echo "--- 릴리스 본문 미리보기 ---"
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          # 주의: `set -e` 에서 `[ ... ] && cmd` 를 단독 문장으로 쓰면 조건이 거짓일 때
          # 그 문장의 종료 코드가 1 이라 스크립트가 죽는다. if 로 쓴다.
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          # 이미 릴리스가 있으면 갱신 (workflow_dispatch 재실행 대비)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 릴리스 갱신: $TAG"
            gh release edit "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          fi
          echo "릴리스: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # ScoreMate 서버에도 올린다 — 앱 안 업데이트 · 다운로드 페이지의 정본(P15 · 서버 P16).
      # 정식 · 사전 릴리스 모두(사전 릴리스는 /download/beta/ 와 앱의 "사전 릴리스 받기"), 시험 태그(-test)는 빼고(서버가 400).
      # 릴리스 키 서명일 때만 — 서버도 서명 인증서를 고정 값과 비교한다. 같은 버전 · 같은 sha256 재실행은 200(성공).
      - name: Upload APK to ScoreMate
        env:
          APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
          SIGNED: ${{ needs.build.outputs.signed-with-release-key }}
          TAG: ${{ needs.verify.outputs.tag }}
          UPLOAD_URL: https://scoremate.noematica.kr/api/v1/app-releases/mrgqpdfviewer/android/  # 앱 이름을 주소에(서버 0.24.0) — 옛 …/app-releases/android/ 와 같은 뜻
        run: |
          set -euo pipefail
          if [ -z "${APP_RELEASE_TOKEN:-}" ]; then
            echo "::notice::APP_RELEASE_TOKEN secret 이 없어 ScoreMate 업로드를 건너뜁니다"; exit 0
          fi
          if [ "$SIGNED" != "true" ]; then
            echo "::notice::릴리스 키로 서명되지 않아 ScoreMate 업로드를 건너뜁니다"; exit 0
          fi
          if [[ "$TAG" == *-test ]]; then
            echo "::notice::시험 태그($TAG)는 ScoreMate 에 올리지 않습니다"; exit 0
          fi
          APK=$(ls dist/*-release.apk | head -n 1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          code=$(curl -sS -o scoremate.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${APP_RELEASE_TOKEN}" \
            -F "apk=@${APK}" -F "version=${TAG}" -F "sha256=${SHA}" \
            -F "version_code=${CODE}" -F "notes=<changelog-section.md" \
            "$UPLOAD_URL")
          cat scoremate.json; echo
          # 201 = 새 판(또는 같은 버전 · 다른 파일), 200 = 같은 버전 · 같은 sha256 재실행
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::ScoreMate 업로드 실패 (HTTP $code)"; exit 1
          fi
          echo "ScoreMate 다운로드: https://scoremate.noematica.kr/download/ ($(cat scoremate.json))" >> "$GITHUB_STEP_SUMMARY"

      # 사용자 설명서도 이 판으로 올린다 — 서버가 /manual/ 에서 HTML 로 보이고 앱 설정 "설명서" 줄이 연다(P19 4단계 · P20 · 서버 P05).
      # 조건은 APK 와 같다(토큰 · 릴리스 키 · -test 제외). 같은 (판, 문서, 언어)를 다시 올리면 200 으로 내용만 바뀐다 —
      # 설명서만 고쳤으면 Release 를 그 태그로 workflow_dispatch 하면 된다(APK 는 같은 sha256 이라 200).
      - name: Upload manual to ScoreMate
        env:
          APP_RELEASE_TOKEN: ${{ secrets.APP_RELEASE_TOKEN }}
          SIGNED: ${{ needs.build.outputs.signed-with-release-key }}
          TAG: ${{ needs.verify.outputs.tag }}
          UPLOAD_URL: https://scoremate.noematica.kr/api/v1/app-manuals/
        run: |
          set -euo pipefail
          if [ -z "${APP_RELEASE_TOKEN:-}" ] || [ "$SIGNED" != "true" ] || [[ "$TAG" == *-test ]]; then
            echo "::notice::ScoreMate 설명서 올리기를 건너뜁니다 (APK 와 같은 조건)"; exit 0
          fi
          # doc lang 파일 — 링크는 서버가 볼 때 이 판에 올라온 filename 끼리 바꾼다
          while read -r doc lang file; do
            code=$(curl -sS -o manual.json -w '%{http_code}' --retry 3 --retry-delay 10 \
              -H "Authorization: Bearer ${APP_RELEASE_TOKEN}" \
              -F "app=mrgqpdfviewer" -F "version=${TAG}" -F "doc=${doc}" -F "lang=${lang}" \
              -F "filename=$(basename "$file")" -F "markdown=@${file};type=text/markdown" \
              "$UPLOAD_URL" </dev/null)
            echo "$doc/$lang ($file): HTTP $code $(cat manual.json)"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "::error::ScoreMate 설명서 올리기 실패 ($doc/$lang, HTTP $code)"; exit 1
            fi
          done <<'DOCS'
          manual ko docs/User_Manual.md
          manual en docs/User_Manual.en.md
          voice-commands ko docs/Voice_Commands.md
          DOCS
          echo "ScoreMate 설명서: https://scoremate.noematica.kr/manual/?v=${TAG}" >> "$GITHUB_STEP_SUMMARY"
